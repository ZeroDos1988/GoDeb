# Weekly update PRs for Go modules, the frontend and the GitHub Actions.
# Each PR runs the full CI; merging one means a fix release (ROADMAP,
# "Produktionsreife").
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    # Feature freeze until 1.0: no major jumps (vite, TypeScript, React
    # plugin), they need their own migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
