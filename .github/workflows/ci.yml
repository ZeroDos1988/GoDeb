name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.sh needs tags and the commit count.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (Typecheck und Build)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Playwright (Mobil-Smoke)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: govulncheck
        # `go run pkg@version` ignores the toolchain line of go.mod, so pin it here.
        run: GOTOOLCHAIN="$(go mod edit -json | jq -r .Toolchain)" go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Debian-Paket (amd64)
        run: ./scripts/build-deb.sh

      - name: Debian-Paket (arm64, Cross)
        run: TARGET_ARCH=arm64 ./scripts/build-deb.sh

      - name: systemd-analyze security
        # Web process (user godeb) must stay low (currently 1.3), the root
        # agent below 8.0 (currently 7.4).
        run: |
          systemd-analyze security --offline=yes --threshold=20 package/debian/lib/systemd/system/godeb.service
          systemd-analyze security --offline=yes --threshold=80 package/debian/lib/systemd/system/godeb-agent.service

      - uses: actions/upload-artifact@v4
        with:
          name: godeb-deb
          path: godeb_*.deb
          retention-days: 14

  # A pushed tag vX.Y.Z publishes the package as a GitHub release. Tags are
  # set by hand; nothing here creates them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: godeb-deb
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" godeb_*.deb --repo "$GITHUB_REPOSITORY" --title "GoDeb $GITHUB_REF_NAME" --generate-notes

  # Puts the new release into the APT repo on GitHub Pages.
  apt-repo:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
